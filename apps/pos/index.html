<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />

    <!--
      Installed to a device, this runs as an app rather than as a page.

      The manifest is written at build time, because it has to name the address
      the app is actually served from. See scripts/sync-sw.mjs.

      The two apple- tags below do the same job for iPhones and iPads, which
      ignore the manifest entirely and have their own way of asking. Without
      them, "Add to Home Screen" on an iPad makes a bookmark that opens Safari,
      with the address bar and tabs still there, which is the one thing this is
      meant to remove.

      black-translucent puts the page under the status bar rather than beside
      it. That is why the viewport says viewport-fit=cover and why the layout
      keeps clear of the safe areas: without both, the clock sits on top of the
      first row of buttons.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      THE ICON, AS FILES, DECLARED HERE.

      These pages declared no icon at all: the tab's mark is drawn in the
      browser at load time so it can follow the restaurant's own colours, and
      nothing static was ever offered. Anything that wants an icon BEFORE the
      page runs — Windows building a taskbar shortcut, a bookmark, a link
      preview — found nothing, and Windows fell back to the browser's own logo
      on a pinned app.

      Several sizes, because an .ico holds 16 through 256 and a browser handed
      only a 512 downscales it by sixteen times. The live-coloured one is still
      added at runtime alongside these; see applyFavicon.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>NiceOps POS, Terminal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
