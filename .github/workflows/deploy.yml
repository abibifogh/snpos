name: Deploy

# Builds all four apps and publishes them to GitHub Pages.
#
# Each app is served from its own subfolder, so one Pages site hosts the lot:
#   /            landing page with links
#   /admin/      admin dashboard
#   /menu/       customer QR menu
#   /kitchen/    kitchen display
#   /pos/        terminal
on:
  push:
    branches: [main, master, claude/restaurant-pos-system-442yd7]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a half-finished deploy is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Work out the base URL
        id: base
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          # Two ways this site can be reached, and they need different builds.
          #
          # On github.io it lives in a subfolder named after the repository, so
          # every asset path has to start with it. On a domain of its own it
          # lives at the root, and those same paths would all 404.
          #
          # Set a repository variable SITE_DOMAIN (Settings -> Secrets and
          # variables -> Actions -> Variables) to the bare hostname, with no
          # https:// and no trailing slash, e.g. order.myrestaurant.com
          if [ -n "$SITE_DOMAIN" ]; then
            echo "root=" >> "$GITHUB_OUTPUT"
            echo "url=https://$SITE_DOMAIN" >> "$GITHUB_OUTPUT"
            echo "domain=$SITE_DOMAIN" >> "$GITHUB_OUTPUT"
            echo "Building for https://$SITE_DOMAIN (site root)"
          else
            REPO="${GITHUB_REPOSITORY#*/}"
            echo "root=/$REPO" >> "$GITHUB_OUTPUT"
            echo "url=https://${GITHUB_REPOSITORY%%/*}.github.io/$REPO" >> "$GITHUB_OUTPUT"
            echo "domain=" >> "$GITHUB_OUTPUT"
            echo "Building for github.io under /$REPO"
          fi

      - name: Build each app
        env:
          VITE_APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          VITE_APPWRITE_PROJECT: ${{ vars.APPWRITE_PROJECT_ID }}
          VITE_DB_ID: ${{ vars.DB_ID || 'snpos' }}
        run: |
          set -e
          ROOT="${{ steps.base.outputs.root }}"
          # The QR codes printed for tables must point at the deployed menu,
          # not at localhost, so the admin app is told where it lives.
          export VITE_MENU_URL="${{ steps.base.outputs.url }}/menu"
          for app in admin menu kitchen pos; do
            BASE_PATH="$ROOT/$app/" npm run build -w "@snpos/$app"
          done

      - name: Assemble the site
        run: |
          set -e
          mkdir -p site
          for app in admin menu kitchen pos; do
            cp -r "apps/$app/dist" "site/$app"
          done
          # Pages runs Jekyll by default, which strips files beginning with _.
          touch site/.nojekyll

          # Tells GitHub which domain this site answers on. Written into the
          # artifact rather than left to the Pages settings alone, so a deploy
          # can never quietly drop the custom domain and send everybody back to
          # the github.io address.
          if [ -n "${{ steps.base.outputs.domain }}" ]; then
            echo "${{ steps.base.outputs.domain }}" > site/CNAME
          fi

          # The one 404 page GitHub Pages actually uses.
          #
          # Pages honours 404.html at the ROOT of the site and nowhere else —
          # a copy inside /admin/ is simply never served. That is why a refresh
          # on an address with no file behind it landed on GitHub's own
          # "There isn't a GitHub Pages site here" instead of the app.
          #
          # So the root page catches everything and sends it where it belongs.
          # /snpos/admin           → /snpos/admin/
          # /snpos/admin/settings  → /snpos/admin/#/settings   (an old-style
          #                          link or bookmark from before hash routing)
          # anything else          → the front door
          cat > site/404.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>One moment…</title>
          <script>
            (function () {
              var apps = ['admin', 'menu', 'kitchen', 'pos'];
              // Where this site's root actually is. On github.io that is the
              // repository folder; on a domain of its own it is "/", and
              // assuming a folder here would treat "admin" as the folder name
              // and never find the app.
              var base = '__BASE__';
              var parts = location.pathname.slice(base.length).split('/').filter(Boolean);
              var rest = parts.slice();
              var app = rest.shift();
              // A missing file is not a missing route. Redirecting a stale
              // /assets/index-OLD.js into the app would answer a script request
              // with HTML, which the browser refuses to run — a blank screen
              // instead of an honest 404.
              var last = rest[rest.length - 1] || '';
              if (last.indexOf('.') !== -1) return;
              if (apps.indexOf(app) === -1) {
                location.replace(base);
                return;
              }
              // Whatever followed the app name was a route, not a file. Hand it
              // back to the app as a hash, where its own router can read it.
              var route = rest.join('/');
              location.replace(base + app + '/' + location.search + (route ? '#/' + route : ''));
            })();
          </script>
          <noscript>This page has moved. Please go back to the address you were given.</noscript>
          HTML
          # The base is known only at build time, so it is stamped in here.
          BASE="${{ steps.base.outputs.root }}/"
          sed -i "s|__BASE__|$BASE|" site/404.html

          # The public front door. It links to the customer menu and nothing
          # else: a page that lists the admin app, the till and the kitchen
          # display is a directory of things to go and try. The staff apps are
          # still at their own addresses — anybody can type one — which is why
          # each of them now refuses a session that is not a staff session.
          # This just stops the site handing out the map.
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="robots" content="noindex">
          <title>Menu</title>
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                   max-width: 26rem; margin: 5rem auto; padding: 0 1.25rem; line-height: 1.6;
                   color: #16202b; text-align: center; }
            a.go { display: block; padding: 1rem 1.15rem; margin: 1.5rem 0; border-radius: 10px;
                   text-decoration: none; background: #0f766e; color: #fff; font-weight: 600; }
            p { color: #5d6b7a; font-size: 0.92rem; }
            @media (prefers-color-scheme: dark) {
              body { background: #11161c; color: #e8edf3; } p { color: #98a5b3; }
            }
          </style>
          <h1>Welcome</h1>
          <a class="go" href="menu/">See the menu</a>
          <p>Scan the code on your table to order from where you are sitting.</p>
          <p style="margin-top:2.5rem;font-size:0.8rem">Staff: use the address you were given.</p>
          HTML

      - name: Keep the previous build's files alongside the new ones
        continue-on-error: true
        run: |
          # Why this exists: each build names its files with a content hash, so
          # a new deploy replaces index-ABC.js with index-XYZ.js and deletes the
          # old one. A browser holding a cached index.html then asks for a file
          # that no longer exists; GitHub Pages answers a missing file with the
          # app's own 404 page, and the browser refuses to run HTML as
          # JavaScript. The result is a blank screen for anyone who happened to
          # load the site shortly before the deploy — "the site is down",
          # despite the deploy having succeeded.
          #
          # Copying the live build's files into the new one costs a few
          # kilobytes and means those requests keep resolving.
          BASE="${{ steps.base.outputs.url }}"
          for app in admin menu kitchen pos; do
            old=$(curl -fsSL --max-time 20 "$BASE/$app/" || true)
            [ -n "$old" ] || continue
            echo "$old" \
              | grep -oE 'assets/[A-Za-z0-9._-]+' \
              | sed 's|^assets/||' \
              | sort -u \
              | while read -r name; do
                  [ -f "site/$app/assets/$name" ] && continue
                  curl -fsSL --max-time 20 "$BASE/$app/assets/$name" -o "site/$app/assets/$name" \
                    && echo "  kept $app/$name" || true
                done
          done

      # enablement turns Pages on if it is not already, so this step cannot
      # fail with "Get Pages site failed" on a repository where nobody has
      # visited the Pages settings yet.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Twenty minutes rather than the default ten.
          #
          # The build was never the slow part — this step only waits for
          # GitHub's own publishing to report finished, and that occasionally
          # crawls. When it does, the action gives up and CANCELS the
          # deployment, so a perfectly good build is thrown away and the live
          # site stays on yesterday's code. Waiting longer costs nothing; a
          # false failure costs a re-run and a worried email.
          timeout: 1200000
          error_count: 10
