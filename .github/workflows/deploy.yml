name: Deploy

# Builds all four apps and publishes them to GitHub Pages.
#
# Each app is served from its own subfolder, so one Pages site hosts the lot:
#   /            landing page with links
#   /admin/      admin dashboard
#   /menu/       customer QR menu
#   /kitchen/    kitchen display
#   /pos/        terminal
on:
  push:
    branches: [main, master, claude/restaurant-pos-system-442yd7]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a half-finished deploy is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Work out the base URL
        id: base
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "root=/$REPO" >> "$GITHUB_OUTPUT"
          echo "url=https://${GITHUB_REPOSITORY%%/*}.github.io/$REPO" >> "$GITHUB_OUTPUT"

      - name: Build each app
        env:
          VITE_APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          VITE_APPWRITE_PROJECT: ${{ vars.APPWRITE_PROJECT_ID }}
          VITE_DB_ID: ${{ vars.DB_ID || 'snpos' }}
        run: |
          set -e
          ROOT="${{ steps.base.outputs.root }}"
          # The QR codes printed for tables must point at the deployed menu,
          # not at localhost, so the admin app is told where it lives.
          export VITE_MENU_URL="${{ steps.base.outputs.url }}/menu"
          for app in admin menu kitchen pos; do
            BASE_PATH="$ROOT/$app/" npm run build -w "@snpos/$app"
          done

      - name: Assemble the site
        run: |
          set -e
          mkdir -p site
          for app in admin menu kitchen pos; do
            cp -r "apps/$app/dist" "site/$app"
            # These are single-page apps: a deep link like /admin/settings has
            # no file behind it, and Pages would serve a 404. Copying index.html
            # to 404.html makes Pages hand the app its own router instead.
            cp "site/$app/index.html" "site/$app/404.html"
          done
          # Pages runs Jekyll by default, which strips files beginning with _.
          touch site/.nojekyll

      - name: Keep the previous build's files alongside the new ones
        continue-on-error: true
        run: |
          # Why this exists: each build names its files with a content hash, so
          # a new deploy replaces index-ABC.js with index-XYZ.js and deletes the
          # old one. A browser holding a cached index.html then asks for a file
          # that no longer exists; GitHub Pages answers a missing file with the
          # app's own 404 page, and the browser refuses to run HTML as
          # JavaScript. The result is a blank screen for anyone who happened to
          # load the site shortly before the deploy — "the site is down",
          # despite the deploy having succeeded.
          #
          # Copying the live build's files into the new one costs a few
          # kilobytes and means those requests keep resolving.
          BASE="${{ steps.base.outputs.url }}"
          for app in admin menu kitchen pos; do
            old=$(curl -fsSL --max-time 20 "$BASE/$app/" || true)
            [ -n "$old" ] || continue
            echo "$old" \
              | grep -oE 'assets/[A-Za-z0-9._-]+' \
              | sed 's|^assets/||' \
              | sort -u \
              | while read -r name; do
                  [ -f "site/$app/assets/$name" ] && continue
                  curl -fsSL --max-time 20 "$BASE/$app/assets/$name" -o "site/$app/assets/$name" \
                    && echo "  kept $app/$name" || true
                done
          done
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>SNPOS</title>
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                   max-width: 34rem; margin: 4rem auto; padding: 0 1.25rem; line-height: 1.6; color: #16202b; }
            a { display: block; padding: 1rem 1.15rem; margin: 0.6rem 0; border: 1px solid #e3e7ec;
                border-radius: 10px; text-decoration: none; color: inherit; }
            a:hover { background: #f6f7f9; }
            b { display: block; font-size: 1.05rem; }
            span { color: #5d6b7a; font-size: 0.9rem; }
            @media (prefers-color-scheme: dark) {
              body { background: #11161c; color: #e8edf3; }
              a { border-color: #2a333e; } a:hover { background: #171d25; } span { color: #98a5b3; }
            }
          </style>
          <h1>SNPOS</h1>
          <a href="admin/"><b>Admin</b><span>Menu, settings, staff, shifts, expenses</span></a>
          <a href="pos/"><b>Terminal</b><span>Tables, orders, payment — for waiters and cashiers</span></a>
          <a href="kitchen/"><b>Kitchen</b><span>Order display and alarm</span></a>
          <a href="menu/"><b>Customer menu</b><span>What guests see when they scan a table QR code</span></a>
          HTML

      # enablement turns Pages on if it is not already, so this step cannot
      # fail with "Get Pages site failed" on a repository where nobody has
      # visited the Pages settings yet.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
