name: Provision Appwrite

# Applies schema changes to Appwrite.
#
# Runs on every merge to main, called from the Deploy workflow, so a schema
# change can never ship without the database that has to hold it. It is safe
# to run every time: it creates what is missing, updates permissions, and
# skips the rest — it never drops anything. Then it stamps the settings row
# with the schema's fingerprint, which is how the apps know the database is
# current (see scripts/schema-fingerprint.mjs).
#
# It can still be run by hand from the Actions tab, with the confirmation
# word, for a database that needs catching up outside a deploy.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "provision" to confirm'
        required: true
        default: ''

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        # Only when started by hand. Called from Deploy, the merge is the decision.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm != 'provision' }}
        run: |
          echo "Nothing was run."
          echo
          echo "This workflow writes to the live database, so it asks you to"
          echo "confirm on purpose. Start it again and type the word"
          echo
          echo "    provision"
          echo
          echo "into the box marked 'Type \"provision\" to confirm', exactly and"
          echo "in lower case. It was given: '${{ inputs.confirm }}'"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply the schema
        run: npm run provision
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          DB_ID: ${{ vars.DB_ID || 'snpos' }}
          RESTAURANT_NAME: ${{ vars.RESTAURANT_NAME || 'My Restaurant' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Africa/Accra' }}
          CURRENCY_CODE: ${{ vars.CURRENCY_CODE || 'GHS' }}
          CURRENCY_SYMBOL: ${{ vars.CURRENCY_SYMBOL || 'GHS ' }}

      - name: Report what exists
        # `always()` so a half-finished provision still reports what landed —
        # that is the whole value of this step. But NOT when the confirmation
        # was never given: nothing has been checked out at that point, so npm
        # fails on a missing package.json and buries the one line that
        # matters ("Type 'provision' in the confirmation box") under a red
        # error that looks like a broken build.
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.confirm == 'provision') }}
        run: npm run doctor
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          DB_ID: ${{ vars.DB_ID || 'snpos' }}
