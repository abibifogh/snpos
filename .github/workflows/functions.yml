name: Deploy functions

# Ships the Appwrite Functions — the parts that must keep running when no
# screen is open: releasing pre-orders at their time, escalating an order the
# kitchen has not acknowledged, emailing receipts and shift summaries.
#
# Manual, like Provision: these run against the live project.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        default: ''

jobs:
  functions:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        if: ${{ inputs.confirm != 'deploy' }}
        run: |
          echo "Type 'deploy' in the confirmation box to run this."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Appwrite CLI
        run: npm install -g appwrite-cli

      - name: Point the CLI at the project
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          appwrite client \
            --endpoint "$APPWRITE_ENDPOINT" \
            --project-id "$APPWRITE_PROJECT_ID" \
            --key "$APPWRITE_API_KEY"
          # appwrite.json carries the project id as a placeholder so the file
          # is not tied to one project; fill it in for this run only.
          sed -i "s|\${APPWRITE_PROJECT_ID}|$APPWRITE_PROJECT_ID|" appwrite.json

      - name: Push the functions
        # --force answers "create a deployment?"; --activate answers "activate it
        # once built?". They are two separate questions in the CLI, and the
        # second one has no default — so without --activate the command stops
        # dead waiting for a keystroke that will never come, and the job fails
        # in eighteen seconds having deployed nothing.
        #
        # --with-variables is deliberately NOT passed: the API key and SMTP
        # settings are set in the next step from GitHub Secrets, and pushing
        # appwrite.json's (empty) variables would wipe them.
        run: appwrite push functions --all --force --activate

      - name: Set their variables
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          DB_ID: ${{ vars.DB_ID || 'snpos' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          set -e
          FAILED=""

          # Where the apps are served from, so an email sent by a function can
          # contain a link somebody can actually click. Same rule as the site
          # build: a domain of its own if one is set, otherwise github.io under
          # the repository name.
          if [ -n "$SITE_DOMAIN" ]; then
            APP_URL="https://$SITE_DOMAIN"
          else
            APP_URL="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}"
          fi
          echo "Links in emails will point at $APP_URL"

          # Create first, update on conflict — so re-running after changing an
          # email password overwrites it rather than quietly keeping the old
          # one.
          #
          # The id is derived from the function and key rather than generated,
          # which is what makes the update path possible without going looking
          # for the row. Appwrite allows 36 characters of [A-Za-z0-9._-];
          # the longest name here comes to 33.
          #
          # Whatever the CLI says on failure is printed. An earlier version of
          # this sent stderr to /dev/null and turned "required option
          # --variable-id not specified" into twelve identical warnings with no
          # cause attached — which cost more time than every other bug here.
          setvar() {
            fn=$1; key=$2; val=$3
            vid=$(printf '%s_%s' "$fn" "$key" | tr 'A-Z-' 'a-z_' | cut -c1-36)

            out=$(appwrite functions create-variable \
                    --function-id "$fn" --variable-id "$vid" \
                    --key "$key" --value "$val" 2>&1) \
              && { echo "  $fn.$key created"; return 0; }

            out=$(appwrite functions update-variable \
                    --function-id "$fn" --variable-id "$vid" \
                    --key "$key" --value "$val" 2>&1) \
              && { echo "  $fn.$key updated"; return 0; }

            echo "::warning::Could not set $fn.$key"
            printf '%s\n' "$out" | sed 's/^/      /'
            FAILED="$FAILED $fn.$key"
          }

          for fn in order-guard preorder-fire kitchen-escalate notify; do
            # A function cannot read the project's API key implicitly; it needs
            # its own copy to write to the database.
            setvar "$fn" APPWRITE_API_KEY "$APPWRITE_API_KEY"
            setvar "$fn" DB_ID "$DB_ID"
          done

          if [ -n "$SMTP_HOST" ]; then
            setvar notify SMTP_HOST "$SMTP_HOST"
            setvar notify SMTP_PORT "${SMTP_PORT:-587}"
            setvar notify SMTP_USER "$SMTP_USER"
            setvar notify SMTP_PASS "$SMTP_PASS"
            setvar notify APP_URL "$APP_URL"
            echo "Email is configured against $SMTP_HOST."
          else
            echo "::warning::No SMTP secrets set — receipts and summaries will be recorded but not emailed."
          fi

          # Fail at the end rather than in the middle, so the log shows every
          # variable that did or did not land. A function without its API key
          # runs and does nothing, which is the failure mode this whole job
          # exists to avoid.
          if [ -n "$FAILED" ]; then
            echo "These variables could not be set:$FAILED"
            exit 1
          fi

      - name: Confirm they are actually there
        # The push can succeed and still leave nothing running — a build that
        # failed, a function that was never created. Checking is three seconds
        # and turns a silent nothing into a red cross.
        run: |
          set -e
          missing=""
          for fn in order-guard preorder-fire kitchen-escalate notify; do
            if appwrite functions get --function-id "$fn" >/dev/null 2>&1; then
              echo "  $fn present"
            else
              missing="$missing $fn"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These functions are not in the project:$missing"
            exit 1
          fi
          echo "All background jobs are deployed."
