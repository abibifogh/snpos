name: Check

# Every push and pull request. Catches a broken build before it can be
# deployed, which is the whole point of having this run somewhere other than
# on someone's laptop.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate the schema
        # schema.mjs throws on load if a collection breaks a database limit or
        # an enum is malformed, so importing it is a real check.
        run: node -e "import('./scripts/schema.mjs').then(m => console.log('schema ok:', m.COLLECTIONS.length, 'collections'))"

      - name: Check the function count against the plan
        # Appwrite's free plan allows four functions. A fifth is accepted by
        # appwrite.json, pushed by the CLI, and rejected by the server with one
        # line buried in a wall of successful build output — so the deploy
        # looks like it worked and one job silently does not exist. Cheaper to
        # fail here.
        run: |
          count=$(node -e "console.log(JSON.parse(require('fs').readFileSync('appwrite.json')).functions.length)")
          echo "appwrite.json declares $count functions"
          if [ "$count" -gt 4 ]; then
            echo "::error::$count functions declared, but the Appwrite free plan allows 4. Fold the extra work into an existing function — notify already runs on a schedule for exactly this reason."
            exit 1
          fi

      - name: Check every write against the schema
        # A typecheck cannot see this: the shape of an Appwrite document lives
        # in schema.mjs, not in a TypeScript type. A missing required field
        # fails for the person using the app, never for the person who wrote it.
        run: node scripts/check-writes.mjs

      - name: Typecheck every app
        run: npm run typecheck

      - name: Typecheck the tests
        run: npm run typecheck:tests

      # The logic suite. Runs before the build on purpose: a wrong commission
      # split should stop a release as surely as a syntax error does, and this
      # is also where the browser and the server copies of the money arithmetic
      # are checked against each other.
      - name: Run the logic tests
        run: npm test

      - name: Build every app
        run: npm run build
        env:
          VITE_APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          VITE_APPWRITE_PROJECT: ${{ vars.APPWRITE_PROJECT_ID }}
          VITE_DB_ID: ${{ vars.DB_ID || 'snpos' }}
